name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flynnmed
          POSTGRES_PASSWORD: flynnmed_ci
          POSTGRES_DB: flynnmed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flynnmed"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://flynnmed:flynnmed_ci@localhost:5432/flynnmed
      JWT_SECRET_KEY: ci-test-secret-not-for-production
      OPENAI_API_KEY: ci-test-placeholder
      SEED_DEMO_ACCOUNTS: "false"
      MCP_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.15.9

      - name: Lint
        run: ruff check backend/

      - name: Run database migrations
        run: alembic upgrade head

      - name: Boot production auth and storage path
        env:
          DATA_BACKEND: sql
          ENVIRONMENT: production
          LLM_PHI_PROCESSING_ALLOWED: "true"
          LLM_APPROVED_HOSTS: api.openai.com
          LLM_APPROVED_MODELS: gpt-5.4-mini,text-embedding-3-small,gpt-image-1,whisper-1,sora-2
          SMTP_HOST: smtp.example.invalid
          SMTP_PORT: "587"
          SMTP_USER: ci@example.invalid
          SMTP_PASSWORD: ci-placeholder
          CLINICIAN_VERIFICATION_ADMIN_KEY: ci-admin-placeholder
        run: |
          python -c "from backend.api import app, readiness; assert app; assert readiness() == {'ok': True}"

      - name: Test
        # These three files are live-API manual smoke scripts (no assertions,
        # each has an `if __name__ == "__main__"` block) rather than automated
        # unit tests -- they need a real OPENAI_API_KEY and network access, so
        # they're excluded from CI. Run them manually when needed.
        #
        run: |
          pytest backend/ -v \
            --ignore=backend/test_pubmed_search.py \
            --ignore=backend/test_rag_engine.py \
            --ignore=backend/test_summarizer.py

      - name: Test evaluation and release gates
        run: pytest evaluations/tests/ -q

  frontend:
    name: Frontend (React/TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck + build
        run: npm run build
